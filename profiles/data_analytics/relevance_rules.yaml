profile_code: data_analytics
relevance_classifier_version: 0.1.0
relevance_rules_version: 0.1.0
relevance_output_schema_version: 0.1.0

# Scores are deterministic evidence strengths, not statistical probabilities.
# Each configured term contributes at most once at its strongest section.
weights:
  approved_role_high: 0.34
  approved_role_medium: 0.26
  approved_role_low: 0.12
  strong_title: 0.30
  general_title: 0.20
  adjacent_title: 0.08
  positive_responsibility: 0.09
  positive_source: 0.06
  strong_requirement: 0.08
  category_requirement: 0.04
  negative_title: 0.36
  negative_responsibility: 0.12
  negative_source: 0.08
  evidence_diversity_bonus: 0.04

thresholds:
  inclusion_score: 0.72
  exclusion_score: 0.30
  meaningful_signal: 0.10
  direct_positive_strength: 0.62
  direct_negative_strength: 0.55
  conflict_strength: 0.30
  conflict_margin: 0.12
  fallback_positive_strength: 0.48
  weak_positive_ceiling: 0.12
  minimum_usable_text_length: 80

limits:
  positive_terms_per_section: 3
  negative_terms_per_section: 3
  requirements_per_group: 3
  source_terms: 2
  maximum_diversity_bonus_families: 3
  evidence_term_max_length: 100
  context_snippet_max_length: 180
  review_evidence_max_length: 600

responsibility_section_multipliers:
  summary_text_clean: 1.00
  bullet_points_clean: 0.90
  description_text_clean: 0.75

