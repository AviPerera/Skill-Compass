profile_code: data_analytics
role_classifier_version: 0.1.0
role_rules_version: 0.1.0
role_output_schema_version: 0.1.0

# Scores are deterministic evidence strengths on 0.0-1.0, not probabilities.
# Repeated occurrences of a configured term do not add further weight.
weights:
  strong_title: 0.56
  supporting_title: 0.28
  context_term: 0.12
  source_hint: 0.04
  conflicting_title: 0.18
  exclusion_title: 0.35

thresholds:
  minimum_classification_score: 0.64
  meaningful_evidence_score: 0.25
  ambiguity_margin: 0.08
  high_confidence_min: 0.80
  medium_confidence_min: 0.64

# Context terms contribute once at the strongest section in which they occur.
section_multipliers:
  summary_text_clean: 1.00
  bullet_points_clean: 0.90
  description_text_clean: 0.75

max_context_terms_per_role: 3
max_source_hints_per_role: 2
evidence_term_max_length: 80
review_evidence_max_length: 480

roles:
  - role_group_code: data_analyst
    role_group_label: Data Analyst
    sort_order: 1
    strong_title_terms:
