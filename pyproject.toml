[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-compass"
version = "0.1.0"
description = "Australian Data Analytics Skills Insights"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
skill-compass = "skill_compass.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
